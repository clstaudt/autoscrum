[project]
name = "autoscrum"
version = "0.1.0"
description = "Autonomous Scrum implementation powered by CrewAI multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]",
    "litellm",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
autoscrum = "autoscrum.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
